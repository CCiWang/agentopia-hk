<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentopia — 深水埗生活模擬 · 港風像素原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e2a29'/%3E%3Crect x='6' y='10' width='8' height='16' fill='%23f0b154'/%3E%3Crect x='14' y='6' width='6' height='20' fill='%23c46a55'/%3E%3Crect x='20' y='14' width='6' height='12' fill='%235c8b76'/%3E%3C/svg%3E">
<style>
/* ================= Agentopia · 設計代碼 ================= */
:root{
  --bg:#0b181a; --panel:#0e2a29; --panel2:#0a2020; --line:rgba(242,230,200,.14);
  --cream:#f2e6c8; --dim:#c6b99a; --faint:#8f876f;
  --amber:#f0b154; --amberdk:#b97c2e; --jade:#5c8b76; --coral:#c46a55;
  --teal:#4a7a7e; --good:#86cf92; --bad:#e0705a; --ink:#191611;
  --ui:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  --sign:"PMingLiU","MingLiU","Noto Serif TC","Source Han Serif TC",serif;
  --mono:Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--ui);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
canvas{display:block}

/* ---------- 舞台與世界 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:#132024;cursor:grab}
#stage.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0;will-change:transform}
#art{width:1600px;height:1000px;image-rendering:pixelated;image-rendering:crisp-edges}
#signLayer,#markerLayer{position:absolute;inset:0;pointer-events:none}
#markerLayer{pointer-events:none}

/* ---------- 唐樓豎招牌（DOM 圖層） ---------- */
@keyframes flicker1{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.5}50%{opacity:1}82%{opacity:.85}84%{opacity:1}}
@keyframes flicker2{0%,100%{opacity:1}63%{opacity:.75}65%{opacity:1}}
@keyframes flicker3{0%,100%{opacity:1}30%,34%{opacity:.65}36%,100%{opacity:1}}
.hksign{position:absolute;pointer-events:none;writing-mode:vertical-rl;transform-origin:50% 0;
  font-family:var(--sign);
  font-size:13.5px;letter-spacing:2px;padding:5px 3px;border:1.5px solid rgba(0,0,0,.55);
  border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.45);line-height:1;white-space:nowrap;
  text-shadow:0 1px 0 rgba(0,0,0,.4)}
.hksign::before{content:"";position:absolute;left:50%;top:-6px;width:2px;height:6px;background:#5a5148}

/* ---------- 地點標記（白色圓 chip + 名稱膠囊） ---------- */
.mk{position:absolute;transform:translate(-50%,-100%) scale(var(--inv,1));transform-origin:50% 100%;
  display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer;z-index:5}
.mk .dot{width:28px;height:28px;border-radius:50%;background:#f5edd8;border:2px solid rgba(20,24,22,.35);
  display:flex;align-items:center;justify-content:center;color:#20322f;box-shadow:0 3px 8px rgba(0,0,0,.5);
  transition:transform .15s ease}
.mk .dot svg{width:15px;height:15px}
.mk:hover .dot{transform:scale(1.14)}
.mk .lab{margin-top:3px;background:rgba(245,237,216,.96);color:#1c2a27;font-size:10.5px;font-weight:600;
  padding:2px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4);font-family:var(--ui)}
.mk.pulse .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--amber);animation:pulse 1.4s infinite}
.mk.pulse .dot{position:relative}
.mk.sel .dot{background:var(--amber);color:#2a1c05;box-shadow:0 0 0 3px rgba(240,177,84,.45),0 3px 8px rgba(0,0,0,.5)}
body.nameless .mk .lab{display:none}
body.markerless .mk{display:none}

@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.5);opacity:0}}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;left:0;right:0;height:64px;z-index:40;display:flex;align-items:center;
  padding:0 16px;gap:10px;
  background:linear-gradient(180deg,rgba(8,20,22,.92),rgba(8,20,22,.62) 75%,rgba(8,20,22,0));
  pointer-events:none}
.hud>*{pointer-events:auto}
.hud-left,.hud-right{display:flex;align-items:center;gap:8px}
.hud-center{position:absolute;left:50%;top:10px;transform:translateX(-50%)}
.chip{display:flex;align-items:center;gap:7px;background:rgba(14,38,37,.85);border:1px solid var(--line);
  border-radius:9px;padding:6px 11px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.chip b{font-weight:600}
.chip .num{font-family:var(--mono);color:var(--amber)}
.chip svg{width:15px;height:15px;flex:none}
.wallet{min-width:120px}
.avatarchip{display:flex;align-items:center;gap:8px;background:rgba(14,38,37,.9);border:1px solid var(--line);
  border-radius:11px;padding:4px 12px 4px 4px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.avatarchip canvas{width:36px;height:36px;border-radius:8px}
.avatarchip div{display:flex;flex-direction:column;line-height:1.25;text-align:left}
.avatarchip b{font-size:13px}
.avatarchip span{font-size:10.5px;color:var(--dim)}
.greenplus{width:38px;height:38px;border-radius:50%;background:#69b96f;color:#0c2410;font-size:20px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(80,180,90,.35)}
.pillbar{display:flex;gap:4px;background:rgba(10,16,17,.9);border:1px solid var(--line);border-radius:999px;
  padding:5px;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.pillbar button{color:var(--cream-dim);padding:5px 14px;border-radius:999px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.pillbar button.on{background:#f2e6c8;color:#16201d}
.pillbar button:hover{color:var(--cream)}

/* 附身按鈕 */
.possess{position:fixed;right:22px;bottom:96px;z-index:44;display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,#f5c46a,#dd9c3a);color:#2a1c05;font-weight:700;font-size:13.5px;
  padding:11px 18px;border-radius:999px;box-shadow:0 8px 22px rgba(224,156,58,.4),inset 0 1px 0 rgba(255,255,255,.4);
  border:1px solid #a86f22}
.possess:hover{transform:translateY(-1px)}
.possess svg{width:16px;height:16px}

/* ---------- 街坊動態 feed ---------- */
.feed{position:fixed;top:78px;right:16px;width:296px;z-index:38;background:rgba(11,30,30,.94);
  border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 36px rgba(0,0,0,.45);
  display:flex;flex-direction:column;overflow:hidden;transition:opacity .25s,transform .3s}
.feed-head{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line)}
.feed-head b{font-size:13px}
.feed-live{width:7px;height:7px;border-radius:50%;background:#86cf92;box-shadow:0 0 8px #86cf92;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.feed-head .sp{flex:1}
.feed-head button{color:var(--dim);font-size:12px}
.feed-list{max-height:300px;overflow-y:auto;padding:6px 8px;scrollbar-width:thin}
.ev{display:flex;gap:9px;padding:7px 6px;border-radius:9px;font-size:12px;line-height:1.45}
.ev:hover{background:rgba(242,230,200,.06)}
.ev .t{font-family:var(--mono);color:var(--faint);font-size:10.5px;flex:none;width:34px}
.ev.pulseev{background:rgba(240,177,84,.1);border-left:2px solid var(--amber)}

/* ---------- 右側面板 ---------- */
.panel{position:fixed;top:74px;right:14px;bottom:96px;width:378px;z-index:46;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#103231,#0a2221);border:1px solid var(--line);border-radius:15px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;
  transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none;
  transition:transform .38s cubic-bezier(.22,1,.36,1),opacity .25s}
.panel.open{transform:none;opacity:1;pointer-events:auto}
.panel-head{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.panel-head .ic{width:38px;height:38px;border-radius:10px;background:rgba(240,177,84,.14);color:var(--amber);
  display:flex;align-items:center;justify-content:center;flex:none}
.panel-head .ic svg{width:20px;height:20px}
.panel-head h2{font-size:18px;letter-spacing:.5px;flex:1}
.panel-head .en{font-size:10.5px;color:var(--faint);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.panel-close{color:var(--dim);font-size:20px;width:30px;height:30px;border-radius:8px}
.panel-close:hover{background:rgba(242,230,200,.08);color:var(--cream)}
.panel-body{flex:1;overflow-y:auto;padding:14px 18px 20px;scrollbar-width:thin}
.desc{font-size:12.5px;line-height:1.65;color:var(--dim);margin-bottom:12px}

.who{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.who .wchip{display:flex;align-items:center;gap:5px;background:rgba(92,139,118,.16);border:1px solid rgba(92,139,118,.4);
  border-radius:999px;padding:3px 9px 3px 4px;font-size:11.5px}
.who .wchip canvas{width:20px;height:20px;border-radius:5px}

.row{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:11px;
  margin-bottom:8px;background:rgba(242,230,200,.03)}
.row .ri{width:30px;height:30px;border-radius:8px;background:rgba(242,230,200,.08);display:flex;align-items:center;justify-content:center;color:var(--cream-dim);flex:none}
.row .ri svg{width:16px;height:16px}
.row .rm{flex:1;min-width:0}
.row .rm b{font-size:13px;display:block}
.row .rm span{font-size:11px;color:var(--faint)}
.row .do{flex:none;background:rgba(240,177,84,.16);color:var(--amber);border:1px solid rgba(240,177,84,.4);
  padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600}
.row .do:hover{background:rgba(240,177,84,.3)}
.row .do.ghost{background:transparent;color:var(--dim)}
.money{font-family:var(--mono);font-size:11.5px}
.money.plus{color:var(--good)} .money.minus{color:var(--bad)}

/* 數據卡 */
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 14px}
.stat{background:rgba(242,230,200,.05);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.stat b{font-family:var(--mono);font-size:16px;color:var(--cream);display:block}
.stat span{font-size:10.5px;color:var(--faint)}
.bigbal{font-family:var(--mono);font-size:30px;color:var(--amber);margin:4px 0 2px}
.bar{height:7px;background:rgba(242,230,200,.1);border-radius:99px;overflow:hidden;margin:5px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),var(--amber));border-radius:99px}
.barlbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-bottom:10px}

/* 成就 */
.ach{display:flex;gap:11px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .aico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ach.done .aico{background:rgba(134,207,146,.18);color:var(--good)}
.ach:not(.done) .aico{background:rgba(242,230,200,.07);color:var(--faint)}
.ach .am{flex:1}
.ach .am b{font-size:13px}
.ach .am p{font-size:11px;color:var(--faint);margin-top:1px}
.ach .ast{font-size:10.5px;font-family:var(--mono);color:var(--dim)}
.ach.done .ast{color:var(--good)}

/* 人物檔案 */
.profhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.profhead canvas{width:64px;height:64px;border-radius:14px;border:2px solid rgba(240,177,84,.5)}
.profhead h3{font-size:19px}
.profhead .sub{font-size:11.5px;color:var(--dim)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv span{color:var(--faint)} .kv b{font-weight:600}
.relchip{display:inline-block;font-size:11px;background:rgba(92,139,118,.2);border:1px solid rgba(92,139,118,.45);
  color:#bfe0cd;border-radius:99px;padding:2px 9px;margin:3px 4px 0 0}

/* ---------- 底部 dock ---------- */
.dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:42;display:flex;gap:3px;
  background:rgba(9,22,23,.93);border:1px solid var(--line);border-radius:16px;padding:6px;
  box-shadow:0 18px 40px rgba(0,0,0,.5)}
.dock button{width:104px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--dim);font-size:11.5px}
.dock button svg{width:18px;height:18px}
.dock button:hover{color:var(--cream)}
.dock button.on{background:rgba(240,177,84,.15);color:var(--cream);box-shadow:inset 0 0 0 1px rgba(240,177,84,.4)}
.dock .sep{width:1px;background:var(--line);margin:5px 3px}

/* 地圖控制 */
.mapctrl{position:fixed;right:18px;bottom:100px;z-index:39;display:flex;flex-direction:column;gap:6px;
  transition:transform .3s}
body.panel-open .mapctrl{transform:translateX(-400px)}
.mapctrl button{width:38px;height:38px;border-radius:10px;background:rgba(14,38,37,.9);border:1px solid var(--line);
  color:var(--cream);font-size:16px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.mapctrl button:hover{background:rgba(240,177,84,.2)}

/* ---------- 社交對話 ---------- */
.dlg{position:fixed;left:18px;bottom:100px;width:560px;z-index:47;background:rgba(13,36,35,.97);
  border:1px solid rgba(240,177,84,.4);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6);
  transform:translateY(20px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.22,1,.36,1)}
.dlg.open{transform:none;opacity:1;pointer-events:auto}
.dlg-head{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.dlg-head b{color:var(--amber)}
.dlg-body{display:flex;gap:12px;padding:14px 16px}
.dlg-body canvas{width:46px;height:46px;border-radius:11px;flex:none}
.dlg-line{flex:1}
.dlg-line .who2{font-size:12px;color:var(--amber);margin-bottom:3px}
.dlg-line .say{font-size:14px;line-height:1.6}
.dlg-actions{display:flex;gap:8px;padding:0 16px 14px}
.dlg-actions button{flex:1;background:rgba(242,230,200,.07);border:1px solid var(--line);border-radius:9px;
  padding:8px;font-size:12.5px;color:var(--cream-dim)}
.dlg-actions button.primary{background:rgba(240,177,84,.18);border-color:rgba(240,177,84,.5);color:var(--amber)}
.dlg-actions button:hover{background:rgba(242,230,200,.12)}

/* ---------- 全螢幕 overlay ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(5,12,13,.72);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s}
.ov.open{opacity:1;pointer-events:auto}

/* 手機 */
.phone{width:322px;height:660px;background:#0c1a1d;border-radius:36px;border:1px solid rgba(242,230,200,.25);
  box-shadow:0 40px 100px rgba(0,0,0,.7),inset 0 0 0 8px #132327;display:flex;flex-direction:column;overflow:hidden}
.phone-status{display:flex;justify-content:space-between;padding:12px 24px 4px;font-size:11px;color:var(--dim);font-family:var(--mono)}
.phone-app{flex:1;overflow-y:auto;padding:10px 14px;scrollbar-width:thin}
.phone-tabs{display:flex;gap:6px;padding:8px 14px;border-top:1px solid var(--line)}
.phone-tabs button{flex:1;font-size:12px;padding:7px;border-radius:9px;color:var(--dim)}
.phone-tabs button.on{background:rgba(240,177,84,.16);color:var(--amber)}
.chat{display:flex;gap:9px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.chat canvas{width:34px;height:34px;border-radius:9px;flex:none}
.chat b{font-size:13px}
.chat p{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{max-width:80%;padding:8px 11px;border-radius:12px;font-size:12.5px;line-height:1.5;margin:8px 0}
.msg.me{background:rgba(64,110,108,.9);margin-left:auto;border-bottom-right-radius:3px}
.msg.ot{background:rgba(242,230,200,.1);border-bottom-left-radius:3px}
.diary{background:rgba(242,230,200,.05);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12px;line-height:1.6}
.diary time{font-size:10px;color:var(--faint);font-family:var(--mono)}
.walcard{background:linear-gradient(135deg,#1d4a44,#12302e);border:1px solid rgba(240,177,84,.35);border-radius:14px;padding:14px;margin-bottom:10px}
.walcard b{font-family:var(--mono);font-size:24px;color:var(--amber)}
.phone-hint{font-size:10.5px;color:var(--faint);text-align:center;padding:8px;border-top:1px dashed var(--line);margin-top:6px}

/* 附身 modal */
.possmodal{width:540px;background:linear-gradient(180deg,#14322f,#0b2322);border:1px solid rgba(240,177,84,.45);
  border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.possmodal h3{font-size:18px;margin-bottom:4px}
.possmodal .ctx{font-size:12px;color:var(--dim);margin-bottom:14px;line-height:1.6}
.possmodal textarea{width:100%;height:78px;background:rgba(242,230,200,.06);border:1px solid var(--line);border-radius:10px;
  color:var(--cream);padding:11px;font-family:var(--ui);font-size:13px;resize:none}
.possmodal textarea:focus{outline:none;border-color:rgba(240,177,84,.5)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{font-size:11.5px;padding:5px 10px;border-radius:99px;background:rgba(242,230,200,.08);color:var(--dim)}
.possmodal .rowbtns{display:flex;gap:8px;margin-top:12px}
.possmodal .rowbtns button{flex:1;padding:10px;border-radius:10px;font-weight:600}
.submit{background:linear-gradient(180deg,#f5c46a,#dd9c3a);color:#2a1c05}
.reaction{margin-top:12px;padding:11px 13px;background:rgba(134,207,146,.08);border-left:3px solid var(--good);
  border-radius:0 10px 10px 0;font-size:13px;line-height:1.6;display:none}
.reaction.show{display:block}

/* tooltip / toast / grain */
#tip{position:fixed;z-index:80;background:#f5edd8;color:#1c2a27;font-size:12px;padding:7px 10px;border-radius:8px;
  pointer-events:none;opacity:0;transition:opacity .12s;max-width:230px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#tip.show{opacity:1}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(8px);z-index:90;
  background:rgba(14,38,37,.96);border:1px solid rgba(240,177,84,.5);color:var(--cream);padding:10px 18px;
  border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.grain{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:.07;mix-blend-mode:overlay;display:none}

@media (max-width:980px){
  .feed{display:none}
  .panel{width:min(378px,92vw)}
  .dlg{width:calc(100vw - 36px)}
  .dock button{width:80px}
}
</style>
</head>
<body>
<div id="stage">
  <div class="world" id="world">
    <canvas id="art" width="1600" height="1000"></canvas>
    <div id="signLayer"></div>
    <div id="markerLayer"></div>
  </div>
</div>
<div class="grain"></div>

<!-- HUD -->
<header class="hud">
  <div class="hud-left">

let cam={x:0,y:0,z:1}, tween=null;
function clampCam(){
  const vw=innerWidth, vh=innerHeight, mW=1600*cam.z, mH=1000*cam.z;
  cam.x=vw>=mW?(vw-mW)/2:Math.min(0,Math.max(vw-mW,cam.x));
  cam.y=vh>=mH?(vh-mH)/2:Math.min(0,Math.max(vh-mH,cam.y));
}
function fitCam(){ cam.z=Math.max(innerWidth/1600, innerHeight/1000); clampCam(); applyCam(); }
function applyCam(){
  world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  world.style.setProperty('--inv',(1/cam.z).toFixed(3));
}

let drag=null;
stage.addEventListener('mousedown',e=>{ if(e.target.closest('.mk')||e.target.closest('button'))return;
  drag={sx:e.clientX,sy:e.clientY,x:cam.x,y:cam.y,moved:false}; stage.classList.add('drag'); });
addEventListener('mousemove',e=>{ if(!drag)return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
  cam.x=drag.x+dx; cam.y=drag.y+dy; clampCam(); applyCam(); });
addEventListener('mouseup',e=>{ if(!drag)return; stage.classList.remove('drag');
  if(!drag.moved){ // 點中人物？
    const w=screenToWorld(e.clientX,e.clientY);
    for(const a of actAgents){ if(Math.hypot(a.x-w.x,a.y-w.y)<13){ openProfile(a.id); } }
  } drag=null; });
stage.addEventListener('wheel',e=>{ e.preventDefault();
  const rect=stage.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const nz=Math.min(3.2,Math.max(Math.max(innerWidth/1600,innerHeight/1000),cam.z*(e.deltaY<0?1.14:0.88)));
  cam.x=mx-(mx-cam.x)*(nz/cam.z); cam.y=my-(my-cam.y)*(nz/cam.z);
  cam.z=nz; clampCam(); applyCam(); },{passive:false});
function screenToWorld(sx,sy){ const r=stage.getBoundingClientRect();
  return {x:(sx-r.left-cam.x)/cam.z, y:(sy-r.top-cam.y)/cam.z}; }

function frame(t){
  ctx.drawImage(off,0,0);
  // 選中/懸停高亮
  const hl=S.selLoc||S.hoverLoc;
  if(hl){ const L=LOC.find(l=>l.id===hl); if(L&&L.rect){
    ctx.strokeStyle=S.selLoc===hl?'#f0b357':'rgba(242,230,200,.55)'; ctx.lineWidth=2;
    ctx.setLineDash(S.selLoc===hl?[6,4]:[4,4]);
    ctx.strokeRect(L.rect.x-2,L.rect.y-2,L.rect.w+4,L.rect.h+4);
    ctx.setLineDash([]);
  }}
  // 社交事件脈衝
  if(S.eventPending){ const L=LOC.find(l=>l.id==='cafe'); const p=(t/400)%1;
    ctx.strokeStyle=`rgba(240,177,84,${0.8*(1-p)})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(L.x,L.y,10+p*18,0,7); ctx.stroke(); }
  // 車
  buses.forEach(b=>{ b.x+=b.sp*b.d/30; if(b.d>0&&b.x>1660)b.x=-60; if(b.d<0&&b.x<-60)b.x=1660;
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(b.x-1,b.y+11,36,3);
    ctx.fillStyle=b.body; ctx.fillRect(b.x,b.y,34,11);
    ctx.fillStyle='#e8e2d2'; ctx.fillRect(b.x,b.y,34,3);
    for(let i=0;i<3;i++){ctx.fillStyle='#9ac0c8';ctx.fillRect(b.x+3+i*9,b.y+4,7,4);}
    ctx.fillStyle='#22262a'; ctx.fillRect(b.x+5,b.y+9,6,3); ctx.fillRect(b.x+23,b.y+9,6,3); });
  // 路人
  walkers.forEach(w=>{ w.x+=w.sp*w.d/30; if(w.x>1640)w.x=-30; if(w.x<-30)w.x=1640;
    drawFig(ctx,w.x,w.y,w.col,Math.floor(t/300+w.bob)%2); });
  // 居民
  actAgents.forEach(a=>{
    const wp=a.path[a.pi];
    if(a.wait>0){ a.wait-=1/30; }
    else { const dx=wp[0]-a.x, dy=wp[1]-a.y, d=Math.hypot(dx,dy);
      if(d<3){ a.x=wp[0]; a.y=wp[1]; a.wait=wp[2];

        a.pi=(a.pi+1)%a.path.length; }
      else { a.x+=dx/d*0.5; a.y+=dy/d*0.5; } }
    drawFig(ctx,a.x,a.y,a.a.shirt,Math.floor(t/250)%2);

    ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.lineWidth=3; ctx.strokeText(a.a.name,a.x+3,a.y-4);
    ctx.fillStyle='#f2e6c8'; ctx.fillText(a.a.name,a.x+3,a.y-4);
  });
  requestAnimationFrame(frame);
}

        <div><h3>${a.name}</h3><div class="sub">${a.age}歲 · ${a.job}</div></div></div>
      <div class="kv"><span>而家位置</span><b>${locName(a.locId)}</b></div>
      <div class="kv"><span>心情</span><b>${a.mood}</b></div>
      <div class="kv"><span>個人目標</span><b style="font-weight:400">${a.asp}</b></div>
      <div style="margin-top:10px"><span style="font-size:11px;color:var(--faint)">關係</span><br>
        ${a.friends.map(f=>{const o=AGENTS.find(x=>x.id===f.id);return `<span class="relchip">${o.name} · ${f.rel}</span>`;}).join('')}</div>
      <div style="margin-top:12px"><span style="font-size:11px;color:var(--faint)">最近動態</span>
        <div class="desc" style="margin:6px 0">• ${[].concat(a.recent).join('<br>• ')}</div></div>`;
    drawAvatar($('panelBody').querySelector('.profhead canvas'),a);
  }
  else if(p.type==='career'){
    $('panelIc').innerHTML=ic('brief'); $('panelTitle').textContent='工作'; $('panelEn').textContent='Career';
    $('panelBody').innerHTML=`
      <div class="stat3">
        <div class="stat"><b style="font-size:14px">${S.occupation}</b><span>現職</span></div>
        <div class="stat"><b>HK$80</b><span>現職時薪</span></div>
        <div class="stat"><b>${S.cafeXP}/600</b><span>咖啡師經驗</span></div>
      </div>
      <div class="bar"><i style="width:${Math.min(100,S.cafeXP/6)}%"></i></div>
      <div class="barlbl"><span>咖啡師等級 LV2</span><span>再${600-S.cafeXP}XP升LV3</span></div>
      <div class="desc">今日可返工時段 17:00–22:00 · 場地：好日子咖啡</div>
      ${JOBS.map(j=>`
        <div class="row">
          <div class="ri">${ic('brief')}</div>
          <div class="rm"><b>${j.title}</b><span>${j.place} · ${j.wage} · 需求：${j.req}</span></div>
          <button class="do ${j.taken?'ghost':''}" data-job="${j.id}">${j.taken?'現職':'應徵'}</button>
        </div>`).join('')}`;
    $('panelBody').querySelectorAll('[data-job]').forEach(b=>b.addEventListener('click',()=>applyJob(b.dataset.job)));
  }
  else if(p.type==='wealth'){
    const inc=TRANS.filter(t=>t.amt>0).reduce((s,t)=>s+t.amt,0);
    const exp=-TRANS.filter(t=>t.amt<0).reduce((s,t)=>s+t.amt,0);
    $('panelIc').innerHTML=ic('coin'); $('panelTitle').textContent='財富'; $('panelEn').textContent='Wealth';
    $('panelBody').innerHTML=`
      <div class="desc">錢包餘額</div>
      <div class="bigbal">HK$${S.balance.toLocaleString()}</div>
      <div class="stat3">
        <div class="stat"><b>1,193</b><span>期初</span></div>
        <div class="stat"><b class="plus" style="color:var(--good)">+${inc}</b><span>近7日收入</span></div>
        <div class="stat"><b style="color:var(--bad)">-${exp}</b><span>近7日支出</span></div>
      </div>
      <div class="bar"><i style="width:${Math.min(100,S.balance/5000*100)}%"></i></div>
      <div class="barlbl"><span>儲蓄目標 HK$5,000</span><span>${S.balance.toLocaleString()} / 5,000</span></div>
      <div class="kv"><span>租金（華安大廈 5樓）</span><b>HK$3,200 / 月</b></div>
      <div class="kv"><span>八達通</span><b>HK$86.4</b></div>
      <div style="margin-top:12px;font-size:11px;color:var(--faint)">最近交易</div>
      ${TRANS.slice(0,8).map(t=>`
        <div class="kv" style="border:0;padding:5px 0">
          <span style="font-family:var(--mono);font-size:11px">${t.t}</span>
          <span style="flex:1;margin:0 10px">${t.d}</span>
          <b class="money ${t.amt>0?'plus':'minus'}">${t.amt>0?'+':''}${t.amt}</b>
        </div>`).join('')}`;
  }
  else if(p.type==='achv'){
    $('panelIc').innerHTML=ic('coin'); $('panelTitle').textContent='成就'; $('panelEn').textContent='Achievements';
    $('panelBody').innerHTML=ACHV.map(a=>{
      const prog=a.id==='savings'?Math.min(S.balance,a.need):(a.id==='start'?Math.min(S.met.length,a.need):(a.prog||0));
      const pct=Math.min(100,prog/a.need*100);
      return `<div class="ach ${a.got?'done':''}">
        <div class="aico">${ic(a.got?'coin':'ball')}</div>
        <div class="am"><b>${a.name}</b><p>${a.desc}</p>
          <div class="bar" style="margin-top:4px"><i style="width:${pct}%"></i></div></div>
        <span class="ast">${a.got?'已達成':prog+'/'+a.need}</span></div>`;}).join('');
  }
  else if(p.type==='guide'){
    $('panelIc').innerHTML=ic('pin'); $('panelTitle').textContent='示範流程'; $('panelEn').textContent='Demo Script';
    $('panelBody').innerHTML=`<div class="desc">五分鐘試玩路線（投影示戲用）：</div>`+
      ['見到深水埗像素城市（拖曳、滾輪縮放）',
       '點「好日子咖啡」標記 → 查看工作地點',
       '做「上一個三小時輪班」→ +HK$240（1,280→1,520）',
       '打開「財富」確認餘額與交易',
       '返回城市，見到咖啡店脈衝提示',
       '點街坊動態 → 打開陳樂言對話',
       '打開「人物」查看關係',
       '點「手機」開啟浮層，再關閉',
       '點「附身」輸入「直接邀請陳樂言去看電影」',
       '打開「成就」查看進度'].map((s,i)=>
        `<div class="kv" style="border:0"><span style="font-family:var(--mono);color:var(--amber)">${i+1}.</span><b style="font-weight:400">${s}</b></div>`).join('');
  }
}
function locName(id){ const l=LOC.find(x=>x.id===id); return l?l.name:'街上'; }
function openLocation(id){ openPanel('loc',id); }
function openProfile(id){ openPanel('profile',id); }

/* ---------- 行為 ---------- */
function addMood(n){ S.mood=Math.max(5,Math.min(100,S.mood+n)); syncHUD(); }
function advanceTime(m){ S.time=(S.time+(m||10))%1440; syncHUD(); }
function fmtT(){ const d=new Date(); return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(Math.floor(S.time/60)).padStart(2,'0')}:${String(S.time%60).padStart(2,'0')}`; }

function doAct(loc,a){
  const act=a.a;
  if(act.type==='pay'){
    if(S.balance<act.amt){ toast('餘額不足，先去返工賺錢'); return; }
    S.balance-=act.amt;
    TRANS.unshift({t:fmtT(),d:act.item+' · '+loc.name,amt:-act.amt});
    addMood(act.mood); advanceTime(act.mins);
    toast(`−HK$${act.amt} · ${act.item}`);
    addEvent(`你在${loc.name}買咗「${act.item}」。`);
  }
  else if(act.type==='earn'){
    S.balance+=act.amt; S.cafeXP+=90;
    TRANS.unshift({t:fmtT(),d:act.item+'（'+act.hours+'小時） · 薪金',amt:act.amt});
    advanceTime(act.mins); addMood(4);
    toast(`+HK$${act.amt} 薪金已到賬`);
    addEvent(`${act.item}收工，賺咗 HK$${act.amt}。`);
    unlockAchv('salary');
    triggerSocialEvent();
  }
  else if(act.type==='free'){
    addMood(act.mood); advanceTime(act.mins); if(act.xp)S.cafeXP+=act.xp; if(act.works)S.works+=act.works;
    toast(act.note||'完成。');
    if(act.meet)meetAgent(act.meet);
  }
  else if(act.type==='note'){
    S.notes.unshift({t:fmtT(),d:act.note||'（今日都係普通又真實的一天。）'});
    addMood(act.mood||0); toast('日記已存入手機。');
  }
  else if(act.type==='open'){ openPanel(act.target); }
  else if(act.type==='chat'){ openDialogue(); }
  syncHUD(); if(S.panel)renderPanel();
}
function meetAgent(id){
  if(S.met.includes(id))return;
  S.met.push(id); const a=AGENTS.find(x=>x.id===id);
  toast(`認識了${a.name}`); addEvent(`你同${a.name}交換咗手機號碼。`);
  const st=ACHV.find(x=>x.id==='start'); st.prog=Math.min(3,S.met.length);
  if(S.met.length>=3)unlockAchv('start');
}
function applyJob(id){
  const j=JOBS.find(x=>x.id===id);
  if(j.taken){ toast('你已經做緊呢份工'); return; }
  if(id==='designer'&&S.works<3){ toast(`作品集不足（${S.works}/3），先去留白設計室整理作品`); return; }
  if(id==='designer'){ S.occupation='初級設計助理'; S.jobPlace='留白設計室'; unlockAchv('rising'); toast('面試通過！下週一返新工'); }
  else { toast(`已登記應徵「${j.title}」，老闆叫你試工`); }
  syncHUD(); renderPanel();
}

/* ---------- 社交事件 ---------- */
const DLG=[
 ['chan','知夏，你今日成個晏晝都喺度沖咖啡，手勢愈來愈熟喎。'],
 ['lin','係呀……不過企足三個鐘，腳都唔係自己嘅。'],
 ['chan','我啱啱喺公司俾人改咗三次稿，我而家只想食碗叉燒飯。'],
 ['lin','（笑）咁啱，我收工都想去茶記。'],
 ['chan','不如一齊？我請你飲奶茶。']
];
let dlgIdx=0;
function triggerSocialEvent(){
  if(S.eventPending||S.dlgDone)return;
  S.eventPending=true;
  addEvent('陳樂言想和林知夏聊聊最近發生的事。',null,true);
  document.querySelector('.mk[data-id="cafe"]')?.classList.add('pulse');
}
function openDialogue(){
  S.eventPending=false;
  document.querySelectorAll('.mk.pulse').forEach(m=>m.classList.remove('pulse'));
  dlgIdx=0; $('dlg').classList.add('open');
  $('dlgWhere').textContent='好日子咖啡 · '+Math.floor(S.time/60)+':'+String(S.time%60).padStart(2,'0');
  renderDlg();
}
function renderDlg(){
  const [who,line]=DLG[dlgIdx];
  const a=AGENTS.find(x=>x.id===who);
  drawAvatar($('dlgAvatar1'),a);
  $('dlgName').textContent=a.name;
  $('dlgSay').textContent=line;
  $('dlgNext').textContent=dlgIdx<DLG.length-1?'繼續傾':'完結';
}
$('dlgNext').addEventListener('click',()=>{
  if(dlgIdx<DLG.length-1){ dlgIdx++; renderDlg(); }
  else { $('dlg').classList.remove('open'); S.dlgDone=true;
    unlockAchv('friend'); addEvent('知夏同樂言一齊去咗美好茶餐廳。'); }
});
$('dlgClose').addEventListener('click',()=>$('dlg').classList.remove('open'));
$('dlgRel').addEventListener('click',()=>openProfile('chan'));
$('dlgPossess').addEventListener('click',()=>{ $('dlg').classList.remove('open'); openPossess(); });

/* ---------- 附身 ---------- */
function openPossess(){ $('possessOv').classList.add('open');
  $('possChips').innerHTML=['直接邀請陳樂言去看電影。','同佢講今日好攰，改日再約。','問佢公司係咪好煩。']
    .map(c=>`<button data-c="${c}">${c}</button>`).join('');
  $('possChips').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>$('possInput').value=b.dataset.c));
}
$('possCancel').addEventListener('click',()=>{$('possessOv').classList.remove('open');$('possReaction').classList.remove('show');});
$('possSubmit').addEventListener('click',()=>{
  const v=$('possInput').value.trim(); if(!v){toast('寫一句想講的話先');return;}
  let r;
  if(v.includes('電影')) r='知夏（面紅）：「等一下！我還沒想好怎麼開口呢！」';
  else if(v.includes('攰')||v.includes('改日')) r='知夏：「……咁都好，我今日真係想早啲返屋企。」';
  else if(v.includes('公司')||v.includes('煩')) r='知夏：「係咪阿姐又改你稿？我上次見你眼都紅埋。」';
  else r='知夏：「你突然咁主動，樂言會嚇一跳㗎。」';
  const el=$('possReaction'); el.textContent=r; el.classList.add('show');
  addMood(8); addEvent('知夏聽咗你嘅指示，同樂言傾多咗幾句。');
  syncHUD();
});

/* ---------- 手機 ---------- */
let phoneTab='msg';
function phoneNow(){ return String(Math.floor(S.time/60)).padStart(2,'0')+':'+String(S.time%60).padStart(2,'0'); }
const CHATS=[
 {id:'chan',who:'陳樂言',a:AGENTS[1],preview:'收工未？想飲奶茶…',msgs:[['ot','係咪就收工？'],['me','差唔多，喺度執緊咖啡機'],['ot','咁我喺門口等你']]},
 {id:'he',who:'許家晴',a:AGENTS[2],preview:'聽日新到洋桔梗…',msgs:[['ot','聽日新到洋桔梗，幫你留一束？'],['me','好呀，幾點開舖？']]},
 {id:'landlord',who:'業主陳太',a:null,preview:'這個月租金…',msgs:[['ot','阿夏，呢個月租金記得過數 HK$3,200']]},
 {id:'mum',who:'媽媽',a:null,preview:'天氣冷，著多件衫',msgs:[['ot','天氣凍，著多件衫']]}
];
function renderPhone(){
  $('phoneTime').textContent=phoneNow();
  const app=$('phoneApp');
  if(phoneTab==='msg'){
    app.innerHTML=CHATS.map(c=>`
      <div class="chat" data-chat="${c.id}"><canvas width="34" height="34"></canvas>
        <div style="flex:1;min-width:0"><b>${c.who}</b><p>${c.preview}</p></div></div>`).join('')
      +`<div class="desc" style="margin-top:10px">（點對話可睇通訊內容）</div>`;
    app.querySelectorAll('.chat').forEach((el,i)=>{ if(CHATS[i].a)drawAvatar(el.querySelector('canvas'),CHATS[i].a);
      else{el.querySelector('canvas').getContext('2d').fillStyle='#3f6265';el.querySelector('canvas').getContext('2d').fillRect(0,0,34,34);}
      el.addEventListener('click',()=>openThread(el.dataset.chat)); });
  }
  else if(phoneTab==='note'){
    app.innerHTML=S.notes.map(n=>`<div class="diary"><time>${n.t}</time><div style="margin-top:4px">${n.d}</div></div>`).join('')
      ||'<div class="desc">（仲未有日記，返屋企「寫日記」就會出現）</div>';
  }
  else {
    const inc=TRANS.filter(t=>t.amt>0).reduce((s,t)=>s+t.amt,0);
    app.innerHTML=`<div class="walcard"><div style="font-size:11px;opacity:.8">錢包餘額</div><b>HK$${S.balance.toLocaleString()}</b></div>`+
      TRANS.slice(0,6).map(t=>`<div class="kv" style="border:0"><span style="font-size:11px">${t.d}</span><b class="money ${t.amt>0?'plus':'minus'}">${t.amt>0?'+':''}${t.amt}</b></div>`).join('');
  }
}
function openThread(id){
  const c=CHATS.find(x=>x.id===id);
  $('phoneApp').innerHTML=`<div style="cursor:pointer;color:var(--amber);margin-bottom:8px" id="backChat">← 訊息</div>`+
    c.msgs.map(m=>`<div class="msg ${m[0]}">${m[1]}</div>`).join('');
  $('backChat').addEventListener('click',()=>{phoneTab='msg';renderPhone();});
}
document.querySelectorAll('.phone-tabs button').forEach(b=>b.addEventListener('click',()=>{
  phoneTab=b.dataset.tab;
  document.querySelectorAll('.phone-tabs button').forEach(x=>x.classList.toggle('on',x===b));
  renderPhone();
}));
$('phoneOv').addEventListener('click',e=>{ if(e.target===$('phoneOv'))$('phoneOv').classList.remove('open'); });

/* ---------- HUD / Dock / 按鈕 ---------- */
function syncHUD(){
  $('hudTime').textContent=String(Math.floor(S.time/60)).padStart(2,'0')+':'+String(S.time%60).padStart(2,'0');
  $('hudBal').textContent=S.balance.toLocaleString();
  $('hudJob').textContent=S.occupation;
  $('hudMood').textContent=S.mood>=75?'輕鬆':S.mood>=55?'平靜':S.mood>=35?'有啲攰':'低落';
}
setInterval(()=>{advanceTime(1);},4000);

document.querySelectorAll('.dock button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.dock button').forEach(x=>x.classList.toggle('on',x===b));
  const v=b.dataset.view;
  if(v==='city'){ closePanel(); }
  else if(v==='people')openPanel('residents');
  else if(v==='career')openPanel('career');
  else if(v==='wealth')openPanel('wealth');
  else if(v==='achv')openPanel('achv');
  else if(v==='phone'){ renderPhone(); $('phoneOv').classList.add('open'); }
}));
$('avatarBtn').addEventListener('click',()=>openProfile('lin'));
$('addBtn').addEventListener('click',()=>openPanel('wealth'));
$('guideBtn').addEventListener('click',()=>openPanel('guide'));
$('districtBtn').addEventListener('click',()=>toast('深水埗 · 福華街（示範地點）'));
$('namesToggle').addEventListener('click',function(){ this.classList.toggle('on'); document.body.classList.toggle('nameless',!this.classList.contains('on')); });
$('feedToggle').addEventListener('click',()=>{ const f=$('feedList'); f.style.display=f.style.display==='none'?'':'none'; });
$('possessBtn').addEventListener('click',openPossess);
$('zoomIn').addEventListener('click',()=>{cam.z=Math.min(3.2,cam.z*1.2);clampCam();applyCam();});
$('zoomOut').addEventListener('click',()=>{cam.z=Math.max(Math.max(innerWidth/1600,innerHeight/1000),cam.z/1.2);clampCam();applyCam();});
$('locateBtn').addEventListener('click',()=>{ const a=actAgents[0];
  cam.z=Math.min(3.2,Math.max(cam.z,Math.max(innerWidth/1600,innerHeight/1000)*1.35));
  cam.x=innerWidth/2-(a.x*cam.z); cam.y=innerHeight/2-(a.y*cam.z); clampCam(); applyCam(); });

addEventListener('resize',()=>{fitCam();});

/* ---------- 啟動 ---------- */
fitCam();
addEvent('林知夏到咗好日子咖啡，準備返工。');
addEvent('許家晴喺海棠花店執緊花桶。');
addEvent('陳樂言放咗工，行緊去咖啡店。');
addEvent('落起微雨，街燈著咗。');
syncHUD();
requestAnimationFrame(frame);
</script>
</body>
</html>
